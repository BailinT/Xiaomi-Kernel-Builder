name: 内核构建 - Samsung Galaxy Note20 Ultra r8s (4.19 OneUI)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建完成后发布到 GitHub Releases (是否发布 Release)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Samsung_Note20_Ultra (r8s) | OneUI | ReSukiSU+SuSFS
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

      # 三星 Note20 Ultra（SM-N986B/N986N/N9860，exynos9830）：Android-Artisan 社区树，4.19.325
      # 基座 dtb 唯一（exynos/exynos9830.dtb），机型差异在原厂 dtbo（boot-only 刷法不动 dtbo 分区）
      DEVICE_NAME : "Samsung_Galaxy_Note20_Ultra"
      DEVICE_CODENAME : "r8s"

      CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
      EXTRA_CMDS : "LD=ld.lld"

      KERNEL_SOURCE : "https://github.com/Android-Artisan/android_kernel_samsung_exynos990.git"
      KERNEL_BRANCH : "bpf111"

      # ZyC-Clang 16：4.19.325 已由 gts7 线验证兼容
      CLANG_SOURCE : "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz"
      CLANG_BRANCH : ""

      GCC_GNU : false
      GCC_64_SOURCE : "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
      GCC_64_BRANCH : "lineage-19.1"
      GCC_32_SOURCE : "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
      GCC_32_BRANCH : "lineage-19.1"

      # 主 defconfig + r8s 机型板级碎片（THP/modem MHI/WiFi CNSS2/触控/camera）
      DEFCONFIG_SOURCE: ""
      DEFCONFIG_NAME : "exynos9830_defconfig"
      DEFCONFIG_ORIGIN_IMAGE: ""
      DEFCONFIG_FROM_BOOT : false

      KERNELSU_SOURCE : ""
      KERNELSU_BRANCH : ""

      KERNELSU_AUTO_GET : "true"
      KERNELSU_AUTO_FORK : "resukisu"

      SUSFS_ENABLE : true
      SUSFS_FIXED : true

      AK3_SOURCE : "https://github.com/BailinT/AnyKernel3.git"
      AK3_BRANCH : "master"

      BOOT_SOURCE : ""

      # 三星 exynos 世代 dtb 在 boot 镜像内；dtbo 分区保持原厂不动
      NEED_DTBO : false
      NEED_SAFE_DTBO : false

      ROM_TEXT : "oneui"

      PYTHON_VERSION: "3"

      PACK_METHOD: "Anykernel3"
      PACK_KMODULES: "false"

      KERNELSU_METHOD: "shell"
      KERNELSU_SUS_PATCH: "false"

      PATCHES_SOURCE: "BailinT/NonGKI_Kernel_Patches"
      PATCHES_BRANCH: "samsung-gts7"

      SUSFS_FOLDER_FIXED: ""
      SUSFS_PATCH_FIXED: ""

      REKERNEL_ENABLE: "false"
      DROIDSPACES_ENABLE: "false"
      NOMOUNT_ENABLE: "false"

      HOOK_METHOD: "syscall"

      KERNEL_PATCH: "false"

      KPM_ENABLE: "false"
      KPM_INLINE: "false"
      KPM_KPATCH_NEXT: "false"
      KPM_PATCH_SOURCE: ""

      BASEBAND_GUARD_ENABLE: "false"
      BASEBAND_GUARD_BOOT: "false"

      # dtb 输出在 dts/exynos/——引擎 pack 只认 dts/vendor/<chip> 非递归 glob，Build 后 staging
      GENERATE_DTB: "true"
      GENERATE_CHIP: "samsung"

      BUILD_DEBUGGER: "true"
      SKIP_PATCH: "true"

      BUILD_OTHER_CONFIG: "true"
      MERGE_CONFIG_FILES: "r8s.config"

      LOCKDEP_FORCE_OFF: "true"
      FREE_MORE_SPACE: "false"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 👤 署名
        run: |
          echo "By 抖音王德发刷机"

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🗂 Stage Samsung DTB (exynos9830 → dts/vendor/samsung)
        run: |
          BOOT_DIR=$GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot
          echo "[+] exynos9830 base dtb built under dts/exynos/:"
          ls -al $BOOT_DIR/dts/exynos/exynos9830.dtb || true
          mkdir -p $BOOT_DIR/dts/vendor/samsung
          cp -fp $BOOT_DIR/dts/exynos/exynos9830.dtb $BOOT_DIR/dts/vendor/samsung/
          echo "[+] staged for pack:"
          ls -al $BOOT_DIR/dts/vendor/samsung/

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files

  release:
    name: Publish GitHub Release
    if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Generate Release Info
        id: vars
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$(date +'%Y%m%d')-${GITHUB_SHA::8}-r8s" >> $GITHUB_OUTPUT
          echo "SHA_SHORT=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_kernels
          pattern: Kernel-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "Samsung Galaxy Note20 Ultra (r8s) OneUI 内核 - ${{ steps.vars.outputs.BUILD_DATE }} (${{ steps.vars.outputs.SHA_SHORT }})"
          body: |
            ## Samsung Galaxy Note20 Ultra (SM-N986B/N986N/N9860, r8s, exynos9830) 内核

            - **构建日期:** ${{ steps.vars.outputs.BUILD_DATE }}
            - **提交哈希:** `${{ steps.vars.outputs.SHA_SHORT }}`
            - **内核版本:** 4.19.325（Android-Artisan 社区树 bpf111）
            - **支持机型:** Galaxy Note20 Ultra 4G/5G (r8s/r8sn)
            - **Root 方案:** ReSukiSU + SuSFS（syscall Hook）
            - **刷法:** Odin/AP 刷 boot 或 AK3 zip 刷 boot；**不动 dtbo 分区**；刷前备份原厂 boot；KNOX 熔断不可逆

            By 抖音王德发刷机
          files: all_kernels/*.zip
