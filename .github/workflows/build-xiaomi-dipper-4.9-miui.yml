name: 内核构建 - 8 dipper (4.9 MIUI)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建完成后发布到 GitHub Releases (是否发布 Release)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Xiaomi_dipper | MIUI | ReSukiSU+SuSFS
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

      DEVICE_NAME : "Xiaomi_8"
      DEVICE_CODENAME : "dipper"

      # KCFLAGS: LawRun CAF 树 GCC 时代老代码 clang 新增 lint 一类接一类；DefaultError 组必须显式 -Wno-error=<cat>
      CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS='-Wno-error -Wno-error=incompatible-function-pointer-types -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=implicit-int -Wno-error=int-conversion'"
      EXTRA_CMDS : ""

      # 社区维护树（BailinT fork LawRun CAF 树，掩码已修）
      KERNEL_SOURCE : "https://github.com/BailinT/LawRun_xiaomi_sdm845_CAF.git"
      KERNEL_BRANCH : "master"

      CLANG_SOURCE : "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
      CLANG_BRANCH : "lineage-20.0"

      GCC_GNU : false
      GCC_64_SOURCE : "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
      GCC_64_BRANCH : "lineage-19.1"
      GCC_32_SOURCE : "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
      GCC_32_BRANCH : "lineage-19.1"

      DEFCONFIG_SOURCE: ""
      DEFCONFIG_NAME : "dipper_defconfig"
      DEFCONFIG_ORIGIN_IMAGE: ""
      DEFCONFIG_FROM_BOOT : false

      KERNELSU_SOURCE : ""
      KERNELSU_BRANCH : ""

      KERNELSU_AUTO_GET : "true"
      KERNELSU_AUTO_FORK : "resukisu"

      SUSFS_ENABLE : true
      SUSFS_FIXED : true

      AK3_SOURCE : "https://github.com/BailinT/AnyKernel3.git"
      AK3_BRANCH : "master"

      BOOT_SOURCE : ""

      NEED_DTBO : false
      NEED_SAFE_DTBO : false

      ROM_TEXT : "miui"

      PYTHON_VERSION: "3"

      PACK_METHOD: "Anykernel3"
      PACK_KMODULES: "false"

      KERNELSU_METHOD: "shell"
      KERNELSU_SUS_PATCH: "false"

      PATCHES_SOURCE: "BailinT/NonGKI_Kernel_Patches"
      PATCHES_BRANCH: "dipper-4.9"

      SUSFS_FOLDER_FIXED: ""
      SUSFS_PATCH_FIXED: "susfs_fix_dipper"

      REKERNEL_ENABLE: "false"
      DROIDSPACES_ENABLE: "false"
      NOMOUNT_ENABLE: "false"

      HOOK_METHOD: "syscall"

      KERNEL_PATCH: "false"

      KPM_ENABLE: "false"
      KPM_INLINE: "false"
      KPM_KPATCH_NEXT: "false"
      KPM_PATCH_SOURCE: ""

      BASEBAND_GUARD_ENABLE: "false"
      BASEBAND_GUARD_BOOT: "false"

      GENERATE_DTB: "false"
      GENERATE_CHIP: "qcom"

      BUILD_DEBUGGER: "true"
      SKIP_PATCH: "true"

      BUILD_OTHER_CONFIG: "false"
      MERGE_CONFIG_FILES: ""

      FREE_MORE_SPACE: "false"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 👤 署名
        run: |
          echo "By 抖音王德发刷机"

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🧩 Repair stat.c vfs_fstatat hook (4.9 flag param + filename_lookup decl)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          sed -i '/^[[:space:]]*struct path \*path, struct path \*root);$/d' fs/stat.c
          if grep -q "extern int ksu_handle_stat" fs/stat.c && ! grep -q "extern int filename_lookup" fs/stat.c; then
            sed -i '/extern int ksu_handle_stat(int \*dfd, struct filename \*\*filename, int \*flags);/a\extern int filename_lookup(int dfd, struct filename *name, unsigned flags,\n\t\t\t\tstruct path *path, struct path *root);' fs/stat.c
          fi
          if ! grep -q "struct filename \*fname" fs/stat.c; then
            sed -i '/if ((flag & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |/i\#ifdef CONFIG_KSU_SUSFS\n\tstruct filename *fname = NULL;\n#endif\n' fs/stat.c
          fi
          sed -i 's/ksu_handle_stat(&dfd, &fname, &flags);/ksu_handle_stat(\&dfd, \&fname, \&flag);/' fs/stat.c
          if grep -q "static int filename_lookup" fs/namei.c; then
            sed -i 's/static int filename_lookup(int dfd, struct filename \*name, unsigned flags,/int filename_lookup(int dfd, struct filename *name, unsigned flags,/' fs/namei.c
          fi
          echo "[+] ksu_handle_stat call: $(grep -n 'ksu_handle_stat(&dfd' fs/stat.c)"
          echo "[+] filename_lookup decl: $(grep -c 'extern int filename_lookup' fs/stat.c || true)"

      - name: 🩹 Repair namespace.c atime indent (clang -Wmisleading-indentation)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # LawRun CAF 树把 if (flags & MS_NOATIME/NODIRATIME) 注释掉后语句行缩进未对齐，clang -Werror 报 misleading
          sed -i '/\/\/if (flags & MS_NOATIME)/{n;s/^\t\tmnt_flags |= MNT_NOATIME;/\tmnt_flags |= MNT_NOATIME;/}' fs/namespace.c
          sed -i '/\/\/if (flags & MS_NODIRATIME)/{n;s/^\t\tmnt_flags |= MNT_NODIRATIME;/\tmnt_flags |= MNT_NODIRATIME;/}' fs/namespace.c
          echo "[+] namespace.c atime indent fixed"

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files

  release:
    name: Publish GitHub Release
    if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Generate Release Info
        id: vars
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$(date +'%Y%m%d')-dipper" >> $GITHUB_OUTPUT
          echo "SHA_SHORT=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_kernels
          pattern: Kernel-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "小米 8 MIUI 内核 - ${{ steps.vars.outputs.BUILD_DATE }}"
          body: |
            ## 小米 8 (dipper) MIUI 内核（4.9）

            - **构建日期:** ${{ steps.vars.outputs.BUILD_DATE }}
            - **支持机型:** 小米 8
            - **目标系统:** MIUI / 澎湃（boot-only）
            - **Root 方案:** ReSukiSU + SuSFS（syscall Hook）
            - **刷法:** 只刷 boot 分区，刷前备份原厂 boot

            By 抖音王德发刷机
          files: all_kernels/*.zip
