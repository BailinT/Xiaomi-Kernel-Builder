name: 内核构建 - 4.19 单机型（校验版）

# 与「内核构建 - 4.19 单机型」同一条构建链，唯一区别是多传 hwid 参数，
# 让 build_kernel.sh 调 hwid/inject_hwid_lock.sh 把白名单校验注进 init/。
# 未授权设备刷进去会 panic（卡 logo 反复重启），不是功能受限。

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'alioth'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      dry_run:
        description: 'DRY RUN：只往 dmesg 打结果、不锁机（新机型第一次核对 ID 用，禁止出货）'
        required: false
        type: boolean
        default: false

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device }} | BakaSU+HWID锁 | MIUI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-hwid-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-hwid-
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
          echo "::warning::DRY RUN 构建 —— 这个包不会锁机器，禁止作为校验版出货"
          touch hwid/DRYRUN
        fi
        echo "Executing command: ./build_kernel.sh ${{ github.event.inputs.device }} ksu hwid miui"
        ./build_kernel.sh ${{ github.event.inputs.device }} ksu hwid miui

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: APTKernel-${{ github.event.inputs.device }}-HWID-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0
