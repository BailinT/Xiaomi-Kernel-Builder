name: 内核构建 - 小米MIX4 odin (5.4 MIUI + odin功能)

on:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "xiaomi_mix4"
  DEVICE_CODENAME : "odin"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  # 5.4 SM8350 内核源（BailinT fork 自 EndCredits，MIUI 全系支持）
  KERNEL_SOURCE : "https://github.com/BailinT/android_kernel_xiaomi_sm8350-miui.git"
  KERNEL_BRANCH : "ASB-2024-10-05"

  # 与 venus/haydn（同平台 5.4 Stable 先例）一致的工具链
  CLANG_SOURCE : "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH : "lineage-20.0"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/lahaina-qgki_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT : false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" # xxksu, rsuntk, next, resukisu and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : true # 5.4.283 odin 专属修复链已备好（含 susfs 底补丁适配与 odin 功能补丁）

  AK3_SOURCE : "https://github.com/BailinT/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "miui"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  # odin 功能补丁仓库（BailinT/NonGKI_Kernel_Patches @ mi_kernel 分支 odin_5.4_283/ 目录）
  PATCHES_SOURCE: "BailinT/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "odin_5.4_283"
  SUSFS_PATCH_FIXED: "odin_phase1_5.4_283"

  REKERNEL_ENABLE: "false" # 首次构建关闭以减少变量，跑通后可开
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true" # 首次构建开启：.rej 会打包上传，便于做 odin 专属修复补丁
  SKIP_PATCH: "true" # 有 .rej 不中断，先看完整构建结果

  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "vendor/odin_QGKI.config,vendor/xiaomi_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: 小米MIX4 (odin) MIUI + odin功能
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 👤 署名
        run: |
          echo "By 抖音王德发刷机"

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🧩 Apply odin overlay (odin_mode 双档电源 + kgsl clamp + adreno OC/掉档 + thermal gates)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          git clone https://github.com/BailinT/NonGKI_Kernel_Patches.git -b mi_kernel odin_patches --depth=1
          # 覆盖式应用（ATK12 odin_patch 同哲学）; 与 clean_hook/KSU setup 改动文件零交集
          cp -v odin_patches/odin_5.4_283/files/drivers/gpu/msm/kgsl_pwrctrl.c drivers/gpu/msm/
          cp -v odin_patches/odin_5.4_283/files/drivers/gpu/msm/adreno.c drivers/gpu/msm/
          cp -v odin_patches/odin_5.4_283/files/drivers/thermal/cpu_cooling.c drivers/thermal/
          cp -v odin_patches/odin_5.4_283/files/drivers/thermal/devfreq_cooling.c drivers/thermal/
          cp -v odin_patches/odin_5.4_283/files/drivers/thermal/qcom/cpu_isolate.c drivers/thermal/qcom/
          cp -v odin_patches/odin_5.4_283/files/drivers/misc/Makefile drivers/misc/
          cp -v odin_patches/odin_5.4_283/files/drivers/misc/odin_mode.c drivers/misc/
          grep -q "odin_mode" drivers/misc/Makefile || false
          grep -q "kgsl_odin_clamp_max" drivers/gpu/msm/kgsl_pwrctrl.c || false
          grep -q "odin_thermal_drop" drivers/thermal/cpu_cooling.c || false
          echo "[+] odin overlay applied"
          rm -rf odin_patches

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
