name: 内核构建 - realme GT 大师版 lunaa AndroidT (5.4 类原生)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建完成后发布到 GitHub Releases (是否发布 Release)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Realme_lunaa | AndroidT | ReSukiSU+SuSFS
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

      # 设备（GT 大师版 AndroidT 固件 = realme UI 3.x/4.x，内核换代 5.4.147；boot-only）
      DEVICE_NAME : "Realme_GT_Master"
      DEVICE_CODENAME : "lunaa"

      CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
      EXTRA_CMDS : ""

      # AndroidT 树（O+ 完整树，5.4.147；dts 含 lunaa 21603 板 overlay；defconfig 865 行）
      KERNEL_SOURCE : "https://github.com/rakshitgarg7/kernel-oplus-RMX3360.git"
      KERNEL_BRANCH : "main"

      # 官方同款工具链 clang-r416183b（O+ 5.4 先例）
      CLANG_SOURCE : "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
      CLANG_BRANCH : "lineage-20.0"

      GCC_GNU : false
      GCC_64_SOURCE : "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
      GCC_64_BRANCH : "lineage-19.1"
      GCC_32_SOURCE : "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
      GCC_32_BRANCH : "lineage-19.1"

      # 树内完整 vendor defconfig（O+ 官方导出），无需碎片合并
      DEFCONFIG_SOURCE: ""
      DEFCONFIG_NAME : "defconfig"
      DEFCONFIG_ORIGIN_IMAGE: ""
      DEFCONFIG_FROM_BOOT : false

      KERNELSU_SOURCE : ""
      KERNELSU_BRANCH : ""

      KERNELSU_AUTO_GET : "true"
      KERNELSU_AUTO_FORK : "resukisu"

      SUSFS_ENABLE : true
      SUSFS_FIXED : false # 5.4.147 首轮无机型 fix patch，.rej 由 BUILD_DEBUGGER 收集后再补

      AK3_SOURCE : "https://github.com/BailinT/AnyKernel3.git"
      AK3_BRANCH : "master"

      BOOT_SOURCE : ""

      NEED_DTBO : false
      NEED_SAFE_DTBO : false

      ROM_TEXT : "androidt"

      PYTHON_VERSION: "3"

      PACK_METHOD: "Anykernel3"
      PACK_KMODULES: "false"

      KERNELSU_METHOD: "shell"
      KERNELSU_SUS_PATCH: "false"

      PATCHES_SOURCE: "BailinT/NonGKI_Kernel_Patches"
      PATCHES_BRANCH: "realme-x"

      SUSFS_FOLDER_FIXED: ""
      SUSFS_PATCH_FIXED: ""

      REKERNEL_ENABLE: "false"
      DROIDSPACES_ENABLE: "false"
      NOMOUNT_ENABLE: "false"

      HOOK_METHOD: "syscall"

      KERNEL_PATCH: "false"

      KPM_ENABLE: "false"
      KPM_INLINE: "false"
      KPM_KPATCH_NEXT: "false"
      KPM_PATCH_SOURCE: ""

      BASEBAND_GUARD_ENABLE: "false"
      PREBUILT_SELINUX: "true"
      BASEBAND_GUARD_BOOT: "false"

      GENERATE_DTB: "false" # 5.4 O+ 先例（rmx2202）：dtb 留 vendor_boot，boot-only 不带
      GENERATE_CHIP: "qcom"

      BUILD_DEBUGGER: "true"
      SKIP_PATCH: "true"

      BUILD_OTHER_CONFIG: "false"
      MERGE_CONFIG_FILES: ""

      FREE_MORE_SPACE: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 👤 署名
        run: |
          echo "By 抖音王德发刷机"

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔗 Oplus flattened-tree symlink (kernel/msm-5.4 → root)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          ln -sfn .. kernel/msm-5.4 || true
          ln -sfn .. kernel/msm-4.19 || true
          echo "[+] kernel/msm-5.4 -> root (相对 include 适配)"
          ls kernel/msm-5.4/mm/internal.h || true

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files

  release:
    name: Publish GitHub Release
    if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Generate Release Info
        id: vars
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$(date +'%Y%m%d')-lunaa-androidt" >> $GITHUB_OUTPUT
          echo "SHA_SHORT=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_kernels
          pattern: Kernel-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "realme GT 大师版 AndroidT 内核 - ${{ steps.vars.outputs.BUILD_DATE }}"
          body: |
            ## realme GT 大师版 (lunaa) AndroidT 固件内核（5.4.147，类原生 realme UI 3.x/4.x）

            - **构建日期:** ${{ steps.vars.outputs.BUILD_DATE }}
            - **支持机型:** GT 大师版（AndroidT 固件；realmeUI 2.0/4.19 包的用户勿刷这个）
            - **目标系统:** AndroidT 类原生（boot-only，dtb 留 vendor_boot 不动）
            - **Root 方案:** ReSukiSU + SuSFS（syscall Hook）
            - **刷法:** 只刷 boot 分区，刷前备份原厂 boot

            By 抖音王德发刷机
          files: all_kernels/*.zip
